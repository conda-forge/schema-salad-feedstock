{% set version = "8.10.20260810193251" %}

package:
  name: schema-salad
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/schema-salad/schema_salad-{{ version }}.tar.gz
  sha256: abf6ae90ebc2c2bd89de7e66387f4c9143aa875de8401dae09a938c210cba703

build:
  number: 0
  skip: true  # [py2k or win]
  entry_points:
    - schema-salad-tool=schema_salad.main:main
    - schema-salad-doc=schema_salad.makedoc:main
  script: SCHEMA_SALAD_USE_MYPYC=0 MYPYPATH=mypy-stubs {{ PYTHON }} -m pip install . --no-deps -vv
  # TODO: SCHEMA_SALAD_USE_MYPYC=1 when https://github.com/python/mypy/issues/21133
  # is fixed, released, and available in conda

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}  # for mypyc
    - {{ stdlib("c") }}
    - mypy ==2.1.0 # for a usable python-librt
  host:
    - python
    - pip
    - mypy ==2.1.0 # setup.py needs this when SCHEMA_SALAD_USE_MYPYC=1
    - types-requests
    - types-dataclasses
    - types-setuptools
    - ruamel.yaml >=0.17.6,<0.20
      # ruamel.yaml is needed for the type hints
      # the newer version: 0.15.99 has py.typed, which mypyc needs
    - black >=24 # also needed for type hints
    - rdflib >=4.2.2,<8.0.0  # more type hints
    - setuptools_scm >=8.0.4,<11
    - filelock # needed for type hints
    - setuptools >=50 # build backend
    - cachecontrol-with-filecache >=0.14.0,<0.15  # needed for type hints
    - rich-argparse
  run:
    - python
    - requests >=1.0
    - ruamel.yaml >=0.17.6,<0.20
    - rdflib >=4.2.2,<8.0.0
    - mistune >=3,<3.3
    - cachecontrol-with-filecache >=0.14.0,<0.15
    - mypy_extensions
    - filelock
    - rich-argparse
    - black

test:
  requires:
    - pytest <9.1
    - pytest-xdist
    - setuptools
  imports:
    - schema_salad
    - schema_salad.tests
  commands:
    - schema-salad-tool --help
    - schema-salad-doc --help
    - python -m pytest --pyargs schema_salad -vv -n auto  # [ not aarch64 ]

about:
  home: https://schema-salad.readthedocs.io/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: Schema Annotations for Linked Avro Data (SALAD)
  dev_url: https://github.com/common-workflow-language/schema_salad

extra:
  recipe-maintainers:
    - croth1
    - chapmanb
    - pvanheus
    - mr-c
